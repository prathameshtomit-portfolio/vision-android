
name: Build VISION CONNECT Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "VisionConnect.kt"
      - "android/VisionConnect/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Kotlin source
        run: |
          mkdir -p android/VisionConnect/app/src/main/java/ai/vision/connect
          cp VisionConnect.kt android/VisionConnect/app/src/main/java/ai/vision/connect/VisionConnect.kt

      - name: Build Android APK
        working-directory: android/VisionConnect
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VISION-CONNECT-Android-APK
          path: android/VisionConnect/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
